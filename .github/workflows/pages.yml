name: pages

# 현황판 사이트(web/)를 GitHub Pages에 올린다. main에 실험 결과나 사이트 코드가 올라올 때마다 다시 만든다.
# web/build.py가 실험 36(최근 10시즌 현황판 다시 계산)의 analysis.json · run_log와 실험 31의 seasons.json에서 data.json을 만들고,
# 정적 파일과 함께 배포한다(시뮬은 하지 않는다).
#
# 처음 한 번: 레포를 공개로 바꾸고 Settings → Pages → Build and deployment → Source를 「GitHub Actions」로 둔다.
# 레포가 비공개인 동안에는 실패하지 않고 건너뛴다(무료 플랜은 비공개 레포에서 Pages를 쓸 수 없다).

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "experiments/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 한 번에 하나씩. 진행 중인 배포는 끝까지 둔다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 데이터 출처 = 실험 36 폴더를 마지막으로 바꾼 커밋
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 사이트 만들기
        run: python web/build.py --out _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
